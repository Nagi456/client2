# MyClientData.dll を、対応する3つの版ぶん、GitHubのWindows環境でまとめてビルドします。
# 使い方: Actionsタブ →「build-dll」→「Run workflow」。完了後、版ごとのArtifactsを取得します。
name: build-dll
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        game: ["26.51.1", "26.40.5", "26.32.2"]
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Add LLVM to PATH
        shell: bash
        run: echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
      - name: Build MyClientData.dll
        run: python tools/build_client.py --game ${{ matrix.game }}
      - name: Collect output
        shell: bash
        run: |
          g="${{ matrix.game }}"
          if [ "$g" = "26.51.1" ]; then d=build/client; else d=build/client-$g; fi
          mkdir -p out/mods/MyClientData
          cp "$d/MyClientData.dll" "$d/manifest.json" out/mods/MyClientData/
      - uses: actions/upload-artifact@v4
        with:
          name: MyClientData-${{ matrix.game }}
          path: source/out
